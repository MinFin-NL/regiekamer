# Installs OpenTofu on the agent and puts it on PATH for later steps.
# Pinned to $(TOFU_VERSION) so a plan and its apply always run the same binary.

steps:
  - bash: |
      set -euo pipefail

      if command -v tofu >/dev/null && tofu version | grep -q "v${TOFU_VERSION}"; then
        echo "OpenTofu ${TOFU_VERSION} already present."
        exit 0
      fi

      INSTALL_DIR="$(Agent.ToolsDirectory)/opentofu/${TOFU_VERSION}"
      mkdir -p "$INSTALL_DIR"

      curl --proto '=https' --tlsv1.2 -fsSL \
        https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh
      chmod +x /tmp/install-opentofu.sh
      /tmp/install-opentofu.sh \
        --install-method standalone \
        --install-path "$INSTALL_DIR" \
        --opentofu-version "${TOFU_VERSION}" \
        --symlink-path -

      echo "##vso[task.prependpath]$INSTALL_DIR"
    displayName: Install OpenTofu $(TOFU_VERSION)
    env:
      TOFU_VERSION: $(TOFU_VERSION)
