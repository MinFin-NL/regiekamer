[project]
name = "regiekamer"
version = "0.1.0"
description = "Regiekamer: demo van een AI-agentorganisatie op Azure AI Foundry en Pydantic AI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.19.0",
    "azure-ai-projects>=2.7.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic-ai-slim[openai]>=2.51",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
