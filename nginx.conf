# Template: the nginx image runs envsubst on it at start-up, so BACKEND_URL is a
# runtime env var of the frontend container (the backend's internal FQDN on
# Azure, http://backend:8000 in docker compose).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Live activity stream (SSE): no buffering, long-lived.
  location ~ ^/api/companies/[^/]+/events$ {
    proxy_pass ${BACKEND_URL}$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $proxy_host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
  }

  location /api/ {
    proxy_pass ${BACKEND_URL}/api/;
    # Container Apps routes on the Host header, so it must be the backend's FQDN.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hiring a Foundry agent or waiting on a model can take a while.
    proxy_read_timeout 120s;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
