# Same shape as invulhulp's pipeline, and deployed next to it: both images go
# into the ACR of invulhulp's resource group and roll out as Container Apps in
# invulhulp's Container Apps environment (backend internal, frontend external
# behind the same IP allowlist). The agents run on the "chat" runtime against
# the same Azure OpenAI deployment as invulhulp's backend.
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  # invulhulp's variable group: AZURE_SERVICE_CONNECTION, the firewall IPs
  # (ALLOWED_IP_1, ALLOWED_IP_2) and the Azure OpenAI endpoint/key
  # (AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY), so both apps share one
  # allowlist and one model.
  - group: invulhulp-secrets
  - name: BACKEND_IMAGE
    value: regiekamer-backend
  - name: FRONTEND_IMAGE
    value: regiekamer-frontend
  - name: RESOURCE_GROUP
    value: rg-invulhulp-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-invulhulp-inno-d
  - name: BACKEND_APP
    value: ca-regiekamer-backend-inno-d
  - name: FRONTEND_APP
    value: ca-regiekamer-frontend-inno-d
  # SQLite lives on an Azure Files share mounted at /data. One backend replica
  # only: SQLite + SMB has no cross-process locking (journal_mode=DELETE).
  # Own storage account and mount name, so it never touches invulhulp's data.
  - name: STORAGE_ACCOUNT
    value: stregiekamerinnod
  - name: FILE_SHARE
    value: regiekamer-data
  - name: STORAGE_MOUNT_NAME
    value: regiekamer-data
  # Same deployment and API version as invulhulp's backend.
  - name: AZURE_OPENAI_DEPLOYMENT
    value: gpt-5.3-chat
  - name: AZURE_OPENAI_API_VERSION
    value: 2025-04-01-preview
  - name: AGENT_RUNTIME_DEFAULT
    value: chat

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and push backend
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              BACKEND_IMAGE: $(BACKEND_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build -f Dockerfile.backend \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest" .
                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest"

          - task: AzureCLI@2
            displayName: Build and push frontend
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              FRONTEND_IMAGE: $(FRONTEND_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build -f Dockerfile.frontend \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest" .
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    # Only main deploys; PR runs build images but never touch the apps.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: Deploy backend and frontend
        steps:
          - task: AzureCLI@2
            displayName: Provision persistent storage
            env:
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              STORAGE_ACCOUNT: $(STORAGE_ACCOUNT)
              FILE_SHARE: $(FILE_SHARE)
              STORAGE_MOUNT_NAME: $(STORAGE_MOUNT_NAME)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                LOCATION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)

                # Idempotent: create returns the existing account unchanged.
                az storage account create \
                  --name "$STORAGE_ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" \
                  --location "$LOCATION" \
                  --sku Standard_LRS \
                  --kind StorageV2 \
                  --min-tls-version TLS1_2 \
                  --output none

                STORAGE_KEY=$(az storage account keys list \
                  --account-name "$STORAGE_ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[0].value" -o tsv)

                az storage share-rm create \
                  --storage-account "$STORAGE_ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$FILE_SHARE" \
                  --quota 4 \
                  --output none

                az containerapp env storage set \
                  --name "$CONTAINER_APP_ENV" \
                  --resource-group "$RESOURCE_GROUP" \
                  --storage-name "$STORAGE_MOUNT_NAME" \
                  --azure-file-account-name "$STORAGE_ACCOUNT" \
                  --azure-file-account-key "$STORAGE_KEY" \
                  --azure-file-share-name "$FILE_SHARE" \
                  --access-mode ReadWrite \
                  --output none

          - task: AzureCLI@2
            displayName: Deploy backend
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              BACKEND_IMAGE: $(BACKEND_IMAGE)
              BACKEND_APP: $(BACKEND_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              STORAGE_MOUNT_NAME: $(STORAGE_MOUNT_NAME)
              AGENT_RUNTIME_DEFAULT: $(AGENT_RUNTIME_DEFAULT)
              AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
              AZURE_OPENAI_API_VERSION: $(AZURE_OPENAI_API_VERSION)
              # From the invulhulp-secrets variable group.
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
                ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
                ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

                # An unset ADO variable expands to the literal "$(NAME)"; treat that as empty.
                clean() { case "$1" in '$('*) echo "";; *) echo "$1";; esac; }
                AZURE_OPENAI_ENDPOINT=$(clean "$AZURE_OPENAI_ENDPOINT")
                AZURE_OPENAI_API_KEY=$(clean "$AZURE_OPENAI_API_KEY")
                if [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ]; then
                  echo "##[error]AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY missing from the invulhulp-secrets variable group." >&2
                  exit 1
                fi

                ENV_VARS=(
                  "DB_PATH=/data/regiekamer.db"
                  "CORS_ORIGINS=*"
                  "AGENT_RUNTIME_DEFAULT=${AGENT_RUNTIME_DEFAULT}"
                  "AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint"
                  "AZURE_OPENAI_API_KEY=secretref:openai-api-key"
                  "AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}"
                  "AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}"
                )
                SECRETS=(
                  "openai-endpoint=${AZURE_OPENAI_ENDPOINT}"
                  "openai-api-key=${AZURE_OPENAI_API_KEY}"
                )

                if az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets "${SECRETS[@]}" \
                    --output none
                  az containerapp update \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --max-replicas 1 \
                    --set-env-vars "${ENV_VARS[@]}" \
                    --output none
                else
                  az containerapp create \
                    --name "$BACKEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-username "$ACR_USER" \
                    --registry-password "$ACR_PASS" \
                    --ingress internal \
                    --target-port 8000 \
                    --env-vars "${ENV_VARS[@]}" \
                    --secrets "${SECRETS[@]}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1 \
                    --output none
                fi

                # Mount the Azure Files share at /data. The CLI has no flag for
                # volume mounts, so patch the app definition via --yaml.
                az containerapp show \
                  --name "$BACKEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  -o json > /tmp/backend-app.json
                python3 - "$STORAGE_MOUNT_NAME" <<'PY'
                import json, sys
                mount_name = sys.argv[1]
                with open("/tmp/backend-app.json") as f:
                    app = json.load(f)
                template = app["properties"]["template"]
                template["volumes"] = [
                    {"name": "data", "storageName": mount_name, "storageType": "AzureFile"}
                ]
                for container in template["containers"]:
                    container["volumeMounts"] = [{"volumeName": "data", "mountPath": "/data"}]
                with open("/tmp/backend-app.json", "w") as f:
                    json.dump(app, f)
                PY
                az containerapp update \
                  --name "$BACKEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --yaml /tmp/backend-app.json \
                  --output none

          - task: AzureCLI@2
            displayName: Deploy frontend
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              FRONTEND_IMAGE: $(FRONTEND_IMAGE)
              FRONTEND_APP: $(FRONTEND_APP)
              BACKEND_APP: $(BACKEND_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
                ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
                ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

                BACKEND_FQDN=$(az containerapp show \
                  --name "$BACKEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                BACKEND_URL="https://${BACKEND_FQDN}"

                if az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp update \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --set-env-vars "BACKEND_URL=${BACKEND_URL}" \
                    --output none
                else
                  az containerapp create \
                    --name "$FRONTEND_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-username "$ACR_USER" \
                    --registry-password "$ACR_PASS" \
                    --ingress external \
                    --target-port 80 \
                    --env-vars "BACKEND_URL=${BACKEND_URL}" \
                    --cpu 0.25 --memory 0.5Gi \
                    --min-replicas 1 --max-replicas 2 \
                    --output none
                fi

          - task: AzureCLI@2
            displayName: Apply firewall rules to frontend
            env:
              FRONTEND_APP: $(FRONTEND_APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              ALLOWED_IP_1: $(ALLOWED_IP_1)
              ALLOWED_IP_2: $(ALLOWED_IP_2)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Same rules and IPs as invulhulp's frontend. No login in this
                # demo: the IP allowlist is the only gate.
                az containerapp ingress access-restriction set \
                  --name "$FRONTEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --rule-name "DWR Next werkplekken" \
                  --ip-address "$ALLOWED_IP_1" \
                  --action Allow
                az containerapp ingress access-restriction set \
                  --name "$FRONTEND_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --rule-name "ITS" \
                  --ip-address "$ALLOWED_IP_2" \
                  --action Allow
